<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/Conta.css">
  <link rel="stylesheet" href="/css/acessibilidade.css">
  <link rel="stylesheet" href="/css/modo-escuro.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="acessibilidade.js"></script>
  <title>Hortifruti: Página de login</title>
</head>

<body>
  <div class="accessibility-container">
    <button id="accessibilityBtn" class="accessibility-button" title="Abrir opções de acessibilidade"
      aria-haspopup="true" aria-expanded="false" aria-controls="accessibilityPanel">
      A
    </button>
    <section id="accessibilityPanel" class="accessibility-panel" role="region" aria-label="Painel de acessibilidade"
      aria-hidden="true" tabindex="-1">
      <div class="panel-header">
        <h2 class="panel-title">Acessibilidade</h2>
        <button id="closePanel" class="close-button" aria-label="Fechar painel">×</button>
      </div>
      <div class="font-control">
        <label for="fontSlider" class="control-label">Tamanho da fonte</label>
        <div class="slider-container">
          <input id="fontSlider" class="font-slider" type="range" min="80" max="130" step="1" value="100" />
          <span id="fontSizeDisplay" class="font-size-display" aria-live="polite" aria-atomic="true">100%</span>
        </div>
      </div>
      <button id="resetFont" class="reset-button">Redefinir tamanho</button>
    </section>
  </div>

  <main class="container">

    <form id="form-login">
      <div class="home-but">
        <a href="index.html">
          <img id="casa-img" src="imgs/white-Home.svg" alt="home">
        </a>
        <div id="trilho" class="trilho">
          <div class="indicador"></div>
        </div>

      </div>
      <h1 class="ignore-font-resize">Login Toca das Frutas</h1>
      <p id="mensagem-login" style="font-weight: bold;"></p>

      <div class="input-box">
        <img src="imgs/perfil2.svg" alt="perfil">
        <input class="email" id="email-login" placeholder="Email" type="email" required>
      </div>

      <div class="input-box">
        <img src="imgs/Lock.svg" alt="cadeado">
        <input id="senha-login" class="senha" placeholder="Senha" type="password" required>
      </div>

      <div class="lembrarsenha">
        <label>
          <input type="checkbox">
          Lembrar da minha senha
        </label>
        <a class="forgot"> Esqueci minha senha </a>
      </div>

      <button type="submit" class="login" id="Login">Login</button>

      <div class="link-de-registro">
        <p>Não tem uma conta? <a class="cadastro">Cadastre-se</a></p>
      </div>
    </form>
  </main>


  <script src="local-storage.js"></script>
  <script src="script.js"></script>
</body>

</html>
