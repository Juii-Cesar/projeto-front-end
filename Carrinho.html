<body>
    <header class="cabecalho">
        <div class="botoes-menu" >
            <a id="botao-home" href="index.html">

            </a>
            <div class="trilho" id="trilho">
                <div class="indicador"></div>
            </div>
        </div>
        <h1>Meu carrinho</h1>
        <div></div>

    <div class="carrinho-content">

            <section id="carrinho-ativo" class="carrinho-ativo">
                <div>
                     <table id="tabela-carrinho">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Total (R$)</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
                </div>
            </section>
            <section id="stt-carrinho" class="stt-carrinho">

                <img id="imagem-carinho-vazio" src="imgs/Melamcia triste.png" alt="imagem melancia triste">
                <h2 id="texto-stt-carrinho">Seu carrinho ainda esta vazio!</h2>
            </section>
            <section class="botoes-carrinho">
                <p class="btn-comprar" id="btn-comprar">comprar</p>

            </section>
        </div>
        </div>
        <script src="script.js"></script>
        <script src="carrinho.js"></script>

<div id="modal-success" class="modal-overlay">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <h2>Compra Confirmada!</h2>
            <p>Compra realizada com sucesso!</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="irParaIndex()">Ir para o inicio</button>
                <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>

    <div id="modal-falha" class="modal-overlay">
        <div class="modal2">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <h2>ERRO!</h2>
            <p>Certifique-se de estar cadastrado e preencher o carrinho!</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="irParaIndex()">Ir para o inicio</button>
                <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>
