<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/feedback.css">
    <link rel="stylesheet" href="/css/acessibilidade.css">
    <link rel="stylesheet" href="/css/modo-escuro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="acessibilidade.js"></script>
    <script src="script.js"></script>
    <title>Deixe seu feedback</title>
</head>
<body>
    <div class="accessibility-container">
    <button id="accessibilityBtn" class="accessibility-button" title="Abrir opções de acessibilidade" aria-haspopup="true" aria-expanded="false" aria-controls="accessibilityPanel">
      A
    </button>
    <section id="accessibilityPanel" class="accessibility-panel" role="region" aria-label="Painel de acessibilidade" aria-hidden="true" tabindex="-1">
      <div class="panel-header">
        <h2 class="panel-title">Acessibilidade</h2>
        <button id="closePanel" class="close-button" aria-label="Fechar painel">×</button>
      </div>
      <div class="font-control">
        <label for="fontSlider" class="control-label">Tamanho da fonte</label>
        <div class="slider-container">
          <input id="fontSlider" class="font-slider" type="range" min="80" max="130" step="1" value="100" />
          <span id="fontSizeDisplay" class="font-size-display" aria-live="polite" aria-atomic="true">100%</span>
        </div>
      </div>
      <button id="resetFont" class="reset-button">Redefinir tamanho</button>
    </section>
  </div>
    
    <div class="container">
        <h1 class="ignore-font-resize"> Deixe sua review! </h1>
        <div id="trilho" class="trilho">
                  <div class="indicador"></div>
                </div>
        <form action="TelaDeErro.html" method="get">
            <div class="estrelinhas">
                <input type="radio" name="estrela" id="estrela5" value="5">
                <label for="estrela5">&#9733;</label>

                <input type="radio" name="estrela" id="estrela4" value="4">
                <label for="estrela4">&#9733;</label>

                <input type="radio" name="estrela" id="estrela3" value="3">
                <label for="estrela3">&#9733;</label>

                <input type="radio" name="estrela" id="estrela2" value="2">
                <label for="estrela2">&#9733;</label>

                <input type="radio" name="estrela" id="estrela1" value="1">
                <label for="estrela1">&#9733;</label>
                    <div class="home-but">
                        <a href="index.html">
                            <img id="casa-img" src="imgs/white-Home.svg" alt="home" usemap="#home">
                        </a>
                    </div>
            </div>

            <textarea placeholder="Escreva sua experiencia" required></textarea>
            <button type="submit"> Enviar review</button>
            
        </form>
    </div>
    
</body>
</html>
