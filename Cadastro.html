
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="stylesheet" href="css/modo-escuro.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="acessibilidade.js"></script>
    <title>Hortifruti: Cadastre-se!</title>
</head>
<body>
      <div class="accessibility-container">
    <button id="accessibilityBtn" class="accessibility-button" title="Abrir opções de acessibilidade" aria-haspopup="true" aria-expanded="false" aria-controls="accessibilityPanel">
      A
    </button>
    <section id="accessibilityPanel" class="accessibility-panel" role="region" aria-label="Painel de acessibilidade" aria-hidden="true" tabindex="-1">
      <div class="panel-header">
        <h2 class="panel-title">Acessibilidade</h2>
        <button id="closePanel" class="close-button" aria-label="Fechar painel">×</button>
      </div>
      <div class="font-control">
        <label for="fontSlider" class="control-label">Tamanho da fonte</label>
        <div class="slider-container">
          <input id="fontSlider" class="font-slider" type="range" min="80" max="130" step="1" value="100" />
          <span id="fontSizeDisplay" class="font-size-display" aria-live="polite" aria-atomic="true">100%</span>
        </div>
      </div>
      <button id="resetFont" class="reset-button">Redefinir tamanho</button>
    </section>
  </div>

    <main class="container">
        <form id="form-cadastro">
            <div class="cabecalho" >
                <h1 class="ignore-font-resize">Cadastro na Toca das Frutas</h1>
                <div class="home-but">
                    <a href="index.html">
                        <i id="home-icon" class="bi bi-house-fill ignore-font-resize" ></i>
                    </a>
                    <div id="trilho" class="trilho">
                        <div id="indicador" class="indicador"></div>
                    </div>
                </div>

            </div>
            <div class="input-box">
                <label>Nome Completo</label>
                <input id="nome" required placeholder="Nome Completo" type="text" title="O nome deve ter entre 15 e 80 letras.">
            </div>

            <div class="input-box">
                <label>Data de Nascimento</label>
                <input id="dataNascimento" type="date">
            </div>

            <div class="input-box">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo">
                    <option value="1">Masculino</option> 
                    <option value="2">Feminino</option>
                    <option value="3">Outros</option>
                </select>
            </div>

            <div class="input-box">
                <label>Nome da Mãe</label>
                <input id="nomeMae" required placeholder="Nome completo da mãe" type="text" title="O nome deve ter entre 15 e 80 letras.">
            </div>

            <div class="input-box-duplo">
                <div class="input-box">
                    <label>Senha</label>
                    <input id="senha" required placeholder="Senha" type="password" title="A senha deve ter de 8 a 20 caracteres, incluindo pelo menos uma letra e um número.">
                </div>
                <div class="input-box">
                    <label>Confirmar Senha</label>
                    <input id="confirmaSenha" required placeholder="Repetir senha" type="password" title="Repita a senha corretamente.">
                </div>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input id="email" required placeholder="Email válido" type="email" title="Digite um email válido.">
            </div>

            <div class="input-box">
                <label>CPF</label>
                <input id="cpf" required placeholder="XXX.XXX.XXX-XX" type="text">
            </div>

            <div class="input-box-duplo">
                <div class="input-box">
                    <label>Telefone</label>
                    <input id="telefone" required placeholder="(+55)XXXXX-XXXX" type="text">
                </div>
                <div class="input-box">
                    <label>Telefone Fixo</label>
                    <input id="telefoneFixo" placeholder="(+55)XXXXX-XXXX" type="text">
                </div>
            </div>

            <div class="input-box">
                <label>Endereço</label>
                <input id="endereco" required placeholder="Endereço válido" type="text">
            </div>

            <div class="input-box">
                <label>CEP</label>
                <input id="cep" required placeholder="XXXXX-XXX" type="text" title="Formato: XXXXX-XXX">
            </div>

             <div class="input-box">
                <label>Rua</label>
                <input id="rua" required  type="text" >
            </div>

            <div class="input-box">
                <label>Bairro</label>
                <input id="bairro" required  type="text" >
            </div>

            <div class="input-box">
                <label>Cidade</label>
                <input id="cidade" required  type="text" >
            </div>

            <div class="input-box">
                <label>Estado</label>
                <input id="estado" required  type="text" >
            </div>
            
            <div class="botoes">
                <button type="submit" class="Cadastrar-se" id="cadastro">Enviar</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>
        </form>
    </main>

    <div id="modal-success" class="modal-overlay">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <h2>Cadastro Realizado!</h2>
            <p>Sua conta foi criada com sucesso. Você será redirecionado para a página de login em instantes.</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="irParaLogin()">Ir para Login</button>
                <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="local-storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
